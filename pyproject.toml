[project]
name = "tum-project-studies-portal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "celery[redis]>=5.4,<6",
  "redis>=5,<6", "beautifulsoup4>=4.12,<5", "pymupdf4llm>=1.28,<2",
  "python-docx>=1.1,<2", "openai>=1.68,<2", "pyjwt[crypto]>=2.10,<3", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["backend"]
