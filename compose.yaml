x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8-alpine
    environment:
      PORTAL_DOMAIN: "${PORTAL_DOMAIN:-:80}"
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
      - "${PORTAL_HTTPS_PORT:-8443}:443"
      - "${PORTAL_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    restart: unless-stopped
    logging: *default-logging
    depends_on: [web, api]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000/api/v1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
    restart: unless-stopped
    logging: *default-logging
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  beat:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-portal}"
      POSTGRES_USER: "${POSTGRES_USER:-portal}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-portal}"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U portal"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
