services:
  caddy:
    image: caddy:2.8-alpine
    environment:
      PORTAL_DOMAIN: "${PORTAL_DOMAIN:-:80}"
    ports:
      - "${PORTAL_HTTP_PORT:-8080}:80"
      - "${PORTAL_HTTPS_PORT:-8443}:443"
      - "${PORTAL_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    restart: unless-stopped
    depends_on: [web, api]
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment: {NEXT_PUBLIC_API_URL: "http://api:8000/api/v1"}
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
  beat:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=INFO"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-portal}"
      POSTGRES_USER: "${POSTGRES_USER:-portal}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-portal}"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U portal"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
